name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 静态校验：JS 语法、manifest 完整性、图标、硬编码密钥
      # --experimental-vm-modules 让 .mjs 也能做语法检查
      # 注意：翻译引擎测试需要外网，e2e 需要本地 Edge，因此不在 CI 中运行
      - name: Validate extension
        run: node --experimental-vm-modules tools/validate.mjs
